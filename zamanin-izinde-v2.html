<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12081d">
<title>Cemre Karışım Motoru – Sonuç</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#07040d;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#100719}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none;animation:sceneIn .8s ease-out both}
@keyframes sceneIn{
  from{filter:blur(5px) brightness(.86);transform:scale(1.012);opacity:.55}
  to{filter:blur(0) brightness(1);transform:scale(1);opacity:1}
}
.hot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:20}
#menuBtn{left:4.5%;top:4.3%;width:12%;height:8%;border-radius:50%}
#shareBtn{left:25%;bottom:8.8%;width:50%;height:7.8%;border-radius:999px}
#prepBtn{left:8%;bottom:1.8%;width:41%;height:5.8%;border-radius:999px}
#retryBtn{right:8%;bottom:1.8%;width:41%;height:5.8%;border-radius:999px}

.menu{position:absolute;left:3%;top:12%;width:min(58vw,400px);background:rgba(31,12,44,.92);border:1px solid rgba(220,182,255,.25);border-radius:24px;overflow:hidden;backdrop-filter:blur(14px);opacity:0;transform:scale(.96) translateY(-8px);pointer-events:none;transition:.18s ease;z-index:40}
.menu.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
.menu button{width:100%;padding:17px 20px;text-align:left;border:0;border-bottom:1px solid rgba(255,255,255,.08);background:transparent;color:#fff;font-weight:700;font-size:17px}
.menu button:last-child{border-bottom:0}

.backdrop{position:absolute;inset:0;background:rgba(10,3,16,.58);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px;z-index:60}
.backdrop.show{display:flex}
.modal{width:min(88vw,520px);background:rgba(35,13,49,.96);border:1px solid rgba(222,185,255,.30);color:#fff;border-radius:26px;padding:24px;box-shadow:0 20px 60px #0008}
.modal h2{margin:0 0 12px;font-size:24px}
.modal p{margin:0 0 16px;line-height:1.45;font-size:16px;color:#eadff2}
.steps{display:grid;gap:10px;margin:14px 0 20px}
.step{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.07);font-size:16px}
.close{width:100%;border:0;border-radius:999px;padding:13px 16px;font-weight:800;font-size:16px;background:#c883ee;color:#24102d}

/* Shared steam */
.steam{position:absolute;pointer-events:none;z-index:11;filter:blur(1.6px)}
.steam span{
  position:absolute;bottom:0;width:30px;height:135px;border-left:5px solid rgba(255,255,255,.94);
  border-radius:50%;opacity:0;animation:steamRise 4.2s infinite ease-in-out;
}
.steam .s1{left:10%;animation-delay:0s}
.steam .s2{left:42%;height:155px;animation-delay:1.25s}
.steam .s3{left:68%;height:125px;animation-delay:2.35s}
@keyframes steamRise{
  0%{transform:translateY(12px) translateX(0) scaleX(.55);opacity:0}
  18%{opacity:.68}
  56%{opacity:.52}
  100%{transform:translateY(-112px) translateX(12px) scaleX(1.45);opacity:0}
}

/* Golden particles for Energia and Zaman */
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#ffd978;box-shadow:0 0 16px 6px rgba(255,188,69,.92);opacity:0;pointer-events:none;z-index:9;animation:sparkFloat 6.5s infinite ease-in-out}
.sp1{left:53%;top:43%;animation-delay:.2s}
.sp2{left:74%;top:38%;animation-delay:1.7s}
.sp3{left:82%;top:54%;animation-delay:3.1s}
.sp4{left:48%;top:61%;animation-delay:4.8s}
@keyframes sparkFloat{
  0%,100%{opacity:0;transform:translate(0,8px) scale(.65)}
  22%{opacity:.92}
  62%{opacity:.52;transform:translate(8px,-10px) scale(1)}
}

/* Zaman lantern */
.lanternGlow{position:absolute;right:-1%;top:52%;width:18%;height:24%;border-radius:50%;background:radial-gradient(circle,rgba(255,190,80,.30),rgba(255,120,25,.10) 45%,transparent 72%);mix-blend-mode:screen;pointer-events:none;animation:lantern 4.7s infinite ease-in-out;z-index:9}
@keyframes lantern{0%,100%{opacity:.48;transform:scale(.98)}42%{opacity:.62;transform:scale(1.04)}67%{opacity:.52}}

/* Winter snow */
.snow{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.snow i{position:absolute;top:-8%;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 5px rgba(255,255,255,.55);animation:snowfall linear infinite}
@keyframes snowfall{to{transform:translate3d(18px,115dvh,0) rotate(180deg);opacity:.15}}

/* Sun breathing for Energy */
.sunGlow{position:absolute;right:11%;top:16%;width:33%;height:28%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,224,145,.45) 0%,rgba(255,182,72,.28) 32%,rgba(255,140,35,.11) 58%,transparent 74%);
  mix-blend-mode:screen;pointer-events:none;animation:sunBreath 5.2s infinite ease-in-out;z-index:8}
.sunCore{position:absolute;right:20%;top:23%;width:12%;height:11%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,246,208,.58),rgba(255,195,90,.28) 45%,transparent 72%);
  mix-blend-mode:screen;pointer-events:none;animation:sunCore 4.3s infinite ease-in-out;z-index:9}
@keyframes sunBreath{0%,100%{opacity:.58;transform:scale(.95)}50%{opacity:.84;transform:scale(1.08)}}
@keyframes sunCore{0%,100%{opacity:.50}50%{opacity:.78}}

.hidden{display:none!important}
@media (min-width:700px){.app{width:min(100vw,calc(100dvh * 1024 / 1536));margin:0 auto}}
</style>
</head>
<body>
<div class="app">
  <img id="bg" class="bg" src="images/zamanin-izinde.png" alt="Cemre Karışım Motoru sonucu">

  <div id="steam" class="steam">
    <span class="s1"></span><span class="s2"></span><span class="s3"></span>
  </div>

  <i class="spark sp1"></i><i class="spark sp2"></i><i class="spark sp3"></i><i class="spark sp4"></i><i class="spark" style="left:67%;top:48%;animation-delay:2.4s;animation-duration:7.2s"></i><i class="spark" style="left:58%;top:34%;animation-delay:5.1s;animation-duration:6.8s"></i>
  <div id="lanternGlow" class="lanternGlow"></div>

  <div id="snow" class="snow hidden" aria-hidden="true">
    <i style="left:5%;animation-duration:8s;animation-delay:-2s"></i>
    <i style="left:14%;animation-duration:10s;animation-delay:-6s"></i>
    <i style="left:23%;animation-duration:7.5s;animation-delay:-1s"></i>
    <i style="left:35%;animation-duration:9s;animation-delay:-4s"></i>
    <i style="left:48%;animation-duration:11s;animation-delay:-8s"></i>
    <i style="left:61%;animation-duration:8.5s;animation-delay:-3s"></i>
    <i style="left:72%;animation-duration:10.5s;animation-delay:-7s"></i>
    <i style="left:83%;animation-duration:7.8s;animation-delay:-5s"></i>
    <i style="left:93%;animation-duration:9.6s;animation-delay:-2.5s"></i>
  </div>

  <div id="sunGlow" class="sunGlow hidden"></div>
  <div id="sunCore" class="sunCore hidden"></div>

  <button id="menuBtn" class="hot" aria-label="Menü"></button>
  <button id="shareBtn" class="hot" aria-label="Sonucu Paylaş"></button>
  <button id="prepBtn" class="hot" aria-label="Nasıl Hazırlanır"></button>
  <button id="retryBtn" class="hot" aria-label="Tekrar Dene"></button>

  <div id="menu" class="menu">
    <button data-action="home">Ana Sayfa</button>
    <button data-action="retry">Yeni Karışım / Tekrar Dene</button>
    <button data-action="about">Karışım Motoru Hakkında</button>
  </div>

  <div id="aboutModal" class="backdrop">
    <div class="modal">
      <h2>Cemre Karışım Motoru</h2>
      <p>Dört kısa seçime göre sana uygun bitki çayı karakterini eşleştiren mağaza içi deneyim ekranıdır. Sonuçlar kişisel tıbbi öneri değildir.</p>
      <button class="close" data-close="aboutModal">Kapat</button>
    </div>
  </div>

  <div id="prepModal" class="backdrop">
    <div class="modal">
      <h2>Nasıl Hazırlanır?</h2>
      <div class="steps">
        <div class="step">🥄 1 tatlı kaşığı karışım</div>
        <div class="step">☕ 200–250 ml sıcak su</div>
        <div class="step">⏳ 5–7 dakika demleme</div>
      </div>
      <button class="close" data-close="prepModal">Kapat</button>
    </div>
  </div>
</div>

<script>
const RESULTS={
  'zamanin-izinde':{
    img:'images/zamanin-izinde.png',
    title:'Cemre Karışım Motoru – Zamanın İzinde',
    text:'Benim Cemre Karışımım: Zamanın İzinde — Yoğun anlarda zihnini ferahlatacak, dikkatini toparlamana eşlik edecek özel bir karışım.',
    fx:'zaman'
  },
  'kis-gunesi':{
    img:'images/kis-gunesi.png',
    title:'Cemre Karışım Motoru – Kış Güneşi',
    text:'Benim Cemre Karışımım: Kış Güneşi — Soğuk günlere sıcaklık katan, baharatlı ve meyvemsi karaktere sahip özel bir karışım.',
    fx:'kis'
  },
  'enerji':{
    img:'images/enerji.png',
    title:'Cemre Karışım Motoru – Enerji',
    text:'Benim Cemre Karışımım: Enerji — Güne daha canlı başlamaya eşlik eden, narenciyeli ve bitkisel karaktere sahip özel bir karışım.',
    fx:'enerji'
  }
};

const params=new URLSearchParams(location.search);
const key=params.get('result')||'zamanin-izinde';
const current=RESULTS[key]||RESULTS['zamanin-izinde'];
document.getElementById('bg').src=current.img;
document.title=current.title;

const steam=document.getElementById('steam');
const snow=document.getElementById('snow');
const sunGlow=document.getElementById('sunGlow');
const sunCore=document.getElementById('sunCore');
const lantern=document.getElementById('lanternGlow');
const sparks=[...document.querySelectorAll('.spark')];

snow.classList.add('hidden');
sunGlow.classList.add('hidden');
sunCore.classList.add('hidden');
lantern.classList.add('hidden');
sparks.forEach(x=>x.classList.add('hidden'));

/* Per-screen animation placement */
if(current.fx==='zaman'){
  steam.style.left='61%'; steam.style.top='57%'; steam.style.width='19%'; steam.style.height='25%';
  lantern.classList.remove('hidden');
  sparks.forEach(x=>x.classList.remove('hidden'));
}
if(current.fx==='kis'){
  steam.style.left='61%'; steam.style.top='55%'; steam.style.width='19%'; steam.style.height='25%';
  snow.classList.remove('hidden');
  lantern.classList.remove('hidden');
}
if(current.fx==='enerji'){
  /* cup is lower-right on Energy image */
  steam.style.left='63%'; steam.style.top='54%'; steam.style.width='18%'; steam.style.height='24%';
  sunGlow.classList.remove('hidden');
  sunCore.classList.remove('hidden');
  sparks.forEach(x=>x.classList.remove('hidden'));
}

const menu=document.getElementById('menu');
const homeUrl='https://cemrebitkisel.github.io/cemre-urunler/';
document.getElementById('menuBtn').onclick=()=>menu.classList.toggle('open');

function openModal(id){menu.classList.remove('open');document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll('.backdrop').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)x.classList.remove('show')}));

document.querySelectorAll('#menu button').forEach(b=>{
  b.onclick=()=>{
    const a=b.dataset.action;
    if(a==='home'||a==='retry') location.href=homeUrl;
    if(a==='about') openModal('aboutModal');
  };
});

document.getElementById('prepBtn').onclick=()=>openModal('prepModal');
document.getElementById('retryBtn').onclick=()=>location.href=homeUrl;

document.getElementById('shareBtn').onclick=async()=>{
  const shareUrl=location.origin+location.pathname+'?result='+key;
  const data={title:current.title,text:current.text,url:shareUrl};
  try{
    if(navigator.share) await navigator.share(data);
    else{
      await navigator.clipboard.writeText(shareUrl);
      alert('Sonuç bağlantısı kopyalandı.');
    }
  }catch(e){}
};
</script>
</body>
</html>
