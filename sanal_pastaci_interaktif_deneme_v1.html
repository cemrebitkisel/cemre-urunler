const STEPS=[['Pasta Tabanı','Kekin lezzetini seçin'],['Krema','İç ve dış kremasını seçin'],['Ara Dolgu','Lezzet katın'],['Dış Kaplama','Pastanın görünümünü seçin'],['Üst Kaplama','Pastaya son dokunuş'],['Dekor & Figür','Pastanızı süsleyin'],['Yazı','İsmi ekleyin']];
const OPT={1:['Vanilyalı','Kakaolu','Red Velvet'],2:['Sade','Çikolata','Çilek','Fıstık'],3:['Meyve','Çikolata','Karamel','Fındık'],4:['Buttercream','Ganaj','Şeker Hamuru','Yarı Çıplak'],5:['Drip Çikolata','Drip Çilek','Drip Karamel','Meyve'],6:['Yok','Bebek Fil','Panda','Safari'],7:['Zarif','Modern','El Yazısı','Renkli']};
let cur=1,state={},name='';const steps=document.querySelector('#steps'),empty=document.querySelector('#empty'),photoCake=document.querySelector('#photoCake'),cakeImg=document.querySelector('#cakeImg'),badge=document.querySelector('#badge'),dots=document.querySelector('#dots');
function card(n,o){let b=document.createElement('button');b.className='choice '+(state[n]===o?'selected':'');if(n<7){let im=document.createElement('img');im.src=ASSETS[n][o];im.alt=o;b.appendChild(im)}let sp=document.createElement('span');sp.textContent=o;b.appendChild(sp);b.onclick=()=>choose(n,o);return b}
let busy=false;const process=document.querySelector('#process'),processThumb=document.querySelector('#processThumb'),processText=document.querySelector('#processText');
const ACTION={1:'Kek tabanı tezgâha alınıyor',2:'Krema pastaya uygulanıyor',3:'Ara dolgu katmanlara ekleniyor',4:'Dış kaplama hazırlanıyor',5:'Üst kaplama uygulanıyor',6:'Dekor pastaya yerleştiriliyor',7:'Yazı son dokunuş olarak ekleniyor'};
function choose(n,o){if(busy)return;state[n]=o;empty.classList.add('hide');busy=true;photoCake.classList.add('show','working');badge.classList.add('working');badge.textContent=ACTION[n]+'…';processText.textContent=ACTION[n];if(n<7&&ASSETS[n]&&ASSETS[n][o]){processThumb.src=ASSETS[n][o];processThumb.style.display='inline-block'}else{processThumb.style.display='none'}process.classList.remove('on');void process.offsetWidth;process.classList.add('on');render();setTimeout(()=>{photoCake.classList.remove('working');process.classList.remove('on');badge.classList.remove('working');badge.textContent=o+' uygulandı ✓';busy=false;},1350)}
function render(){steps.innerHTML='';STEPS.forEach((x,k)=>{let n=k+1,d=document.createElement('section');d.className='step '+(n===cur?'active ':'')+(n<cur&&state[n]?'done':'');let h=document.createElement('div');h.className='head';h.innerHTML=`<div class=num>${n<cur&&state[n]?'✓':n}</div><div><b>${x[0]}</b><small>${x[1]}</small></div><div class=chev>${n===cur?'⌃':'›'}</div>`;h.onclick=()=>{cur=n;render()};d.appendChild(h);if(n===cur){if(n<7){let c=document.createElement('div');c.className='choices';OPT[n].forEach(o=>c.appendChild(card(n,o)));d.appendChild(c)}else{let w=document.createElement('div');w.className='writing';let inp=document.createElement('input');inp.placeholder='Örn: İyi ki doğdun…';inp.value=name;inp.oninput=e=>{name=e.target.value;badge.textContent=name?name+' pastaya yazılacak ✓':'Yazınızı girin';};w.appendChild(inp);let st=document.createElement('div');st.className='styles';OPT[7].forEach(o=>{let b=document.createElement('button');b.className='style '+(state[7]===o?'selected':'');b.textContent=o;b.onclick=()=>choose(7,o);st.appendChild(b)});w.appendChild(st);d.appendChild(w)}}steps.appendChild(d)});dots.innerHTML='';for(let i=1;i<=7;i++){let d=document.createElement('div');d.className='dot '+(i===cur?'on':i<cur&&state[i]?'done':'');d.textContent=i;dots.appendChild(d)}}
next.onclick=()=>{if(busy)return;if(!state[cur]){badge.textContent='Bu aşamada bir seçim yapın.';return}if(cur<7){cur++;render()}else{summary.textContent=STEPS.map((x,i)=>state[i+1]).filter(Boolean).join(' • ')+(name?' • '+name:'');final.classList.add('show')}};back.onclick=()=>{if(cur>1){cur--;render()}};edit.onclick=()=>final.classList.remove('show');render();
</script></body></html>
