<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sanal Pastacı — Deneme Motoru</title>
<style>
:root{--ink:#2c2521;--muted:#7c716a;--line:#e7ddd5;--red:#c93250;--cream:#fbf5ee;--dark:#28221f}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#eee7df;color:var(--ink)}
button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:410px 1fr}
.control{background:#fff;padding:28px 30px;display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:3}
.brand{display:flex;gap:12px;align-items:center}.brand i{width:45px;height:45px;border-radius:14px;background:var(--dark);display:grid;place-items:center;font-style:normal;font-size:23px}.brand h1{font-size:22px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}
.progress{display:flex;gap:5px;margin:24px 0 22px}.progress i{height:6px;flex:1;border-radius:9px;background:#ece5df}.progress i.on{background:var(--red)}
.kicker{font-size:11px;color:var(--red);font-weight:900;letter-spacing:.12em}.question h2{font-size:28px;line-height:1.08;margin:7px 0 8px}.question>p{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;text-align:left;min-height:78px;cursor:pointer;transition:.15s}.choice:hover{transform:translateY(-1px);border-color:#cdbeb4}.choice b{display:block;font-size:13px}.choice small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.choice .ico{font-size:20px;display:block;margin-bottom:5px}
.choice.selected{border:2px solid var(--red);background:#fff8fa}.choice:disabled{opacity:.45;cursor:default}
.wait{display:none;margin-top:18px;background:#f8f3ee;border-radius:14px;padding:13px;font-size:12px;color:#625952}.wait.show{display:block}.dots:after{content:"";animation:dots 1.2s infinite}@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
.recipe{margin-top:auto;padding-top:24px}.recipe h3{font-size:12px;margin:0 0 8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#f3eee9;border-radius:99px;padding:6px 8px;font-size:9px;font-weight:800}.reset{margin-top:13px;border:0;background:transparent;color:#81766f;text-decoration:underline;font-size:11px;cursor:pointer}
.stage{position:relative;overflow:hidden;min-height:100vh;background:linear-gradient(#c9b6a3 0 17%,#ead8c5 17% 58%,#b8845f 58% 61%,#b98d68 61% 100%)}
.tiles{position:absolute;inset:17% 0 42%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 110px),repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 1px,transparent 1px 70px)}
.shelf{position:absolute;top:10%;left:9%;right:8%;height:9px;background:#694c3b;box-shadow:0 7px 10px #0002}.jar{position:absolute;bottom:8px;width:38px;height:48px;background:#eee9dc;border:3px solid #ffffffaa;border-radius:6px 6px 12px 12px}.jar:after{content:"";position:absolute;left:-2px;right:-2px;top:-7px;height:7px;background:#6b5548;border-radius:4px}
.sign{position:absolute;right:8%;top:4%;font-family:Georgia,serif;font-style:italic;font-size:27px;color:#fff9;text-shadow:0 2px 3px #0003}
.counter{position:absolute;left:0;right:0;bottom:0;height:39%;background:linear-gradient(#a87857,#8c5e42);border-top:10px solid #5e4435;box-shadow:0 -9px 22px #0002}
.counter:after{content:"";position:absolute;inset:25px 0 0;background:repeating-linear-gradient(90deg,transparent 0 150px,#00000012 151px 153px)}
.sceneTitle{position:absolute;top:25px;left:30px;background:#ffffffdd;padding:10px 14px;border-radius:14px;box-shadow:0 7px 20px #0002;z-index:5}.sceneTitle b{font-size:13px}.sceneTitle span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.chef{position:absolute;left:18%;bottom:25%;width:235px;height:440px;transform-origin:50% 90%;z-index:2}.head{position:absolute;width:92px;height:105px;background:#e7b68e;border-radius:46% 46% 44% 44%;left:72px;top:77px;box-shadow:inset -10px -4px 0 #0000000d}.hair{position:absolute;left:68px;top:78px;width:99px;height:42px;background:#4a3328;border-radius:50px 50px 12px 12px}.face{position:absolute;left:72px;top:86px;width:92px;height:96px;background:#e7b68e;border-radius:45%}.face:before,.face:after{content:"";position:absolute;top:42px;width:6px;height:6px;background:#392b25;border-radius:50%}.face:before{left:24px}.face:after{right:24px}.smile{position:absolute;left:34px;top:65px;width:26px;height:12px;border-bottom:3px solid #9c5c55;border-radius:50%}
.hat{position:absolute;left:57px;top:19px;width:122px;height:79px}.hat i{position:absolute;background:#fff;border-radius:50%}.hat i:nth-child(1){width:61px;height:61px;left:4px;top:9px}.hat i:nth-child(2){width:69px;height:69px;left:32px}.hat i:nth-child(3){width:58px;height:58px;right:0;top:13px}.hat:after{content:"";position:absolute;left:19px;right:12px;bottom:0;height:28px;background:#fff;border-radius:7px}
.body{position:absolute;left:45px;top:172px;width:145px;height:190px;background:#fff;border-radius:35px 35px 15px 15px;box-shadow:inset -15px 0 #eee}.body:before{content:"";position:absolute;left:70px;top:0;bottom:0;border-left:2px solid #ddd}.buttons{position:absolute;left:59px;top:28px;display:grid;gap:21px}.buttons i{width:6px;height:6px;background:#444;border-radius:50%}
.neck{position:absolute;left:99px;top:160px;width:36px;height:29px;background:#dca97f}.arm{position:absolute;width:36px;height:155px;background:#fff;border-radius:18px;top:190px;transform-origin:18px 16px}.arm.left{left:45px;transform:rotate(22deg)}.arm.right{left:161px;transform:rotate(-20deg)}.hand{position:absolute;width:31px;height:31px;background:#e7b68e;border-radius:50%;bottom:-12px;left:2px}.leg{position:absolute;top:345px;width:55px;height:96px;background:#282828}.leg.l{left:62px}.leg.r{left:120px}
.work{position:absolute;left:48%;bottom:31%;width:440px;height:300px;z-index:3}.board{position:absolute;left:28px;bottom:22px;width:370px;height:48px;background:linear-gradient(#e2c393,#ae8355);border-radius:50%;box-shadow:0 18px 22px #0004}
.cake{position:absolute;left:87px;bottom:54px;width:255px;height:170px;transition:.45s}.tier{position:absolute;left:20px;bottom:0;width:215px;height:90px;border-radius:50% / 14%;background:var(--cake,#e5c18d);box-shadow:inset -22px -2px #0002,0 13px 16px #0003;overflow:visible}.tier:before{content:"";position:absolute;left:0;right:0;top:-9px;height:28px;border-radius:50%;background:var(--cake,#e5c18d);box-shadow:inset -12px -6px #0001}.cream{position:absolute;left:20px;bottom:38px;width:215px;height:23px;border-radius:50%;background:var(--cream,#fff);box-shadow:0 4px 5px #0002;opacity:0;transition:.4s}.filling{position:absolute;left:31px;bottom:51px;width:193px;height:10px;opacity:0;background:repeating-linear-gradient(90deg,#c83c4e 0 12px,transparent 12px 25px);transition:.4s}.coat{position:absolute;left:16px;bottom:-2px;width:223px;height:99px;border-radius:50% / 14%;background:var(--coat,#f6dce4);box-shadow:inset -25px -3px #0001;opacity:0;transition:.5s}.coat:before{content:"";position:absolute;left:0;right:0;top:-8px;height:28px;border-radius:50%;background:var(--coat,#f6dce4)}.topcoat{position:absolute;left:17px;bottom:75px;width:221px;height:30px;border-radius:50%;background:var(--top,#fff);opacity:0;transition:.4s}.topcoat.drip:after{content:"";position:absolute;left:18px;top:14px;width:16px;height:31px;background:var(--top,#fff);border-radius:0 0 10px 10px;box-shadow:42px 7px 0 var(--top),91px -1px 0 var(--top),137px 8px 0 var(--top),174px 1px 0 var(--top)}
.figure{position:absolute;left:66px;bottom:83px;width:125px;height:125px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 6px #0004);opacity:0;transition:.5s;z-index:4}.nameplate{position:absolute;left:74px;bottom:21px;min-width:108px;text-align:center;background:#fff9;padding:5px 9px;border-radius:12px;font-size:15px;font-weight:900;color:#a92b45;opacity:0;z-index:5}
.tool{position:absolute;left:3px;top:170px;width:190px;height:18px;background:#a66c42;border-radius:12px;transform-origin:15px 9px;opacity:0;z-index:5}.tool:before{content:"";position:absolute;right:-27px;top:-7px;width:48px;height:31px;background:#bbb;border-radius:2px 18px 18px 2px}
.rolling{background:#b77d4c}.rolling:before{background:#d5a26e;width:100px;right:-58px;border-radius:20px}
.status{position:absolute;right:28px;bottom:25px;background:#24201de8;color:#fff;padding:12px 15px;border-radius:13px;font-size:11px;z-index:7;max-width:280px}
.stage.busy .chef{animation:bob .7s ease-in-out infinite alternate}.stage.busy .arm.right{animation:armwork .55s ease-in-out infinite alternate}.stage.busy .tool{opacity:1;animation:toolwork .65s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px) rotate(.5deg)}}@keyframes armwork{from{transform:rotate(-40deg)}to{transform:rotate(-72deg)}}@keyframes toolwork{from{transform:translate(185px,45px) rotate(15deg)}to{transform:translate(260px,54px) rotate(-8deg)}}
.finalOverlay{display:none;position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#fff,#e8ddd2);z-index:20;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px}.finalOverlay.show{display:flex}.finalOverlay h2{font-size:38px;margin:8px 0}.finalOverlay p{color:var(--muted);max-width:520px}.finalCake{position:relative;width:360px;height:280px;transform:scale(1.2);margin:15px 0 28px}.finalBtns{display:flex;gap:9px}.finalBtns button{border:0;border-radius:13px;padding:12px 16px;font-weight:900}.wa{background:#25D366;color:#fff}.again{background:#28221f;color:#fff}
@media(max-width:900px){.app{grid-template-columns:1fr}.control{min-height:570px}.stage{min-height:720px}.chef{left:4%;transform:scale(.85)}.work{left:43%;transform:scale(.85);transform-origin:left bottom}}
</style>

<div class="app">
<section class="control">
 <div class="brand"><i>👨‍🍳</i><div><h1>Sanal Pastacı</h1><p>Seçimini yap, pastacın hazırlasın.</p></div></div>
 <div class="progress" id="progress"></div>
 <div class="question" id="question"></div>
 <div class="wait" id="wait"><b id="waitText">Hazırlanıyor</b><span class="dots"></span></div>

</section>

<section class="stage" id="stage">

 <div class="work"><div class="board"></div><div class="cake" id="cake"><div class="tier"></div><div class="cream"></div><div class="filling"></div><div class="coat"></div><div class="topcoat drip"></div><img class="figure" id="figure"><div class="nameplate" id="nameplate"></div></div><div class="tool" id="tool"></div></div>
 <div class="counter"></div><div class="status" id="status">Bir taban seçerek başlayın.</div>
 <div class="finalOverlay" id="finalOverlay"><div style="font-size:12px;font-weight:900;color:#c93250">PASTANIZ HAZIR</div><h2 id="finalTitle">Afiyet olsun! 🎂</h2><p>Seçtiğiniz malzemeler ve dekorlarla hazırlanan pasta tasarımınız.</p><div class="finalCake" id="finalCake"></div><div class="finalBtns"><button class="wa" id="share">WhatsApp'tan Gönder</button><button class="again" id="again">Tasarımı Değiştir</button></div></div>
</section>
</div>

const stages=[
 {title:"Pasta tabanını seç",desc:"Pastacımız seçtiğiniz tabanı hazırlayıp tezgâha yerleştirecek.",key:"base",action:"Taban hazırlanıyor",choices:[["Vanilyalı","🍰","Klasik vanilyalı pandispanya"],["Kakaolu","🍫","Yoğun kakaolu pandispanya"],["Red Velvet","❤️","Kırmızı kadife kek"],["Limonlu","🍋","Ferah limon aroması"]]},
 {title:"Kremanızı seçin",desc:"Ara kat kremasını seçin. Pastacımız spatulayla uygulayacak.",key:"cream",action:"Krema uygulanıyor",choices:[["Vanilya","🥛","Hafif pastacı kreması"],["Çikolata","🍫","Çikolatalı ganaj kreması"],["Frambuaz","🫐","Meyveli pembe krema"],["Fıstık","🌿","Antep fıstıklı krema"]]},
 {title:"İç malzemeyi seç",desc:"Pastanın ara katına eklenecek malzemeyi seçin.",key:"filling",action:"İç malzeme yerleştiriliyor",choices:[["Çilek","🍓","Taze çilek dilimleri"],["Muz","🍌","Muz dilimleri"],["Çikolata","🍫","Çikolata parçaları"],["Fıstık","🥜","Antep fıstığı parçaları"]]},
 {title:"Dış kaplamayı seç",desc:"Pastanın dış görünüşünü belirleyin.",key:"coat",action:"Pasta dıştan kaplanıyor",choices:[["Pembe Buttercream","🌸","Yumuşak pembe"],["Beyaz Buttercream","🤍","Klasik beyaz"],["Çikolata Ganaj","🤎","Yoğun çikolata"],["Pastel Mavi","🩵","Pastel mavi krema"]]},
 {title:"Üst kaplamayı seç",desc:"Pastacımız pastanın üst yüzeyini tamamlayacak.",key:"top",action:"Üst kaplama uygulanıyor",choices:[["Beyaz Drip","🤍","Beyaz çikolata akış"],["Çikolata Drip","🍫","Bitter ganaj akış"],["Pembe Drip","🌷","Pembe çikolata"],["Sade Krema","✨","Temiz ve sade"]]},
 {title:"Dekor temasını seç",desc:"Son dokunuş: pastacımız seçtiğiniz figürü pastanın üzerine yerleştirecek.",key:"decor",action:"Dekor yerleştiriliyor",choices:[["Mickey & Minnie","🐭","Çift karakter"],["Panda","🐼","Panda figürü"],["Bebek Fil","🐘","Sevimli fil figürü"],["Sade","✨","Figürsüz tasarım"]]},
 {title:"İsim ve yaşı yaz",desc:"Pastanın son kişiselleştirmesini yapın.",key:"personal",action:"İsim plakası hazırlanıyor",input:true}
];
let step=0,busy=false,state={};
const $=q=>document.querySelector(q);
function colors(){
 const base={Vanilyalı:"#e7c99c",Kakaolu:"#69412f","Red Velvet":"#9e3540",Limonlu:"#e7d58f"}[state.base]||"#e5c18d";
 const cream={Vanilya:"#fff6dc",Çikolata:"#76503c",Frambuaz:"#efafbd",Fıstık:"#b7c98c"}[state.cream]||"#fff";
 const coat={"Pembe Buttercream":"#f0c9d5","Beyaz Buttercream":"#f6f1e9","Çikolata Ganaj":"#654232","Pastel Mavi":"#bddbe5"}[state.coat]||"#f6dce4";
 const top={"Beyaz Drip":"#fff9ed","Çikolata Drip":"#5c382d","Pembe Drip":"#efb8c8","Sade Krema":coat}[state.top]||"#fff";
 $("#cake").style.setProperty("--cake",base);$("#cake").style.setProperty("--cream",cream);$("#cake").style.setProperty("--coat",coat);$("#cake").style.setProperty("--top",top);
}
function renderQuestion(){
 $("#progress").innerHTML=stages.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join("");
 const s=stages[step]; let body=`<div class="kicker">ADIM ${step+1} / ${stages.length}</div><h2>${s.title}</h2><p>${s.desc}</p>`;
 if(s.input) body+=`<div style="display:grid;grid-template-columns:1fr 100px;gap:9px"><input id="nm" placeholder="İsim" value="${state.name||''}" style="padding:13px;border:1px solid var(--line);border-radius:13px"><input id="age" type="number" min="1" max="99" placeholder="Yaş" value="${state.age||''}" style="padding:13px;border:1px solid var(--line);border-radius:13px"></div><button id="personalGo" style="margin-top:10px;width:100%;border:0;border-radius:13px;padding:13px;background:var(--dark);color:#fff;font-weight:900">Pastayı Tamamla</button>`;
 else body+=`<div class="choices">${s.choices.map(c=>`<button class="choice ${state[s.key]===c[0]?'selected':''}" data-v="${c[0]}"><span class="ico">${c[1]}</span><b>${c[0]}</b><small>${c[2]}</small></button>`).join("")}</div>`;
 $("#question").innerHTML=body;
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>choose(b.dataset.v));
 if(s.input) $("#personalGo").onclick=()=>{state.name=$("#nm").value.trim()||"İsimsiz";state.age=$("#age").value.trim();doAction()};
}
function choose(v){if(busy)return;state[stages[step].key]=v;doAction()}
function doAction(){
 busy=true;document.querySelectorAll(".choice").forEach(b=>b.disabled=true);$("#wait").classList.add("show");$("#waitText").textContent=stages[step].action;$("#stage").classList.add("busy");$("#sceneSub").textContent=stages[step].action+"…";$("#status").textContent=stages[step].action+"…";
 $("#tool").classList.toggle("rolling",step===0);
 setTimeout(()=>{applyStage(step);$("#stage").classList.remove("busy");$("#wait").classList.remove("show");busy=false;if(step<stages.length-1){step++;renderQuestion();$("#sceneSub").textContent="Bir sonraki seçiminizi bekliyor.";$("#status").textContent="Sonraki adımı seçebilirsiniz."}else finish();renderChips()},1450);
}
function applyStage(i){
 colors();
 if(i===1)$(".cream").style.opacity=1;
 if(i===2)$(".filling").style.opacity=1;
 if(i===3)$(".coat").style.opacity=1;
 if(i===4){$(".topcoat").style.opacity=1;$(".topcoat").classList.toggle("drip",state.top!=="Sade Krema")}
 if(i===5){
   const f=$("#figure");let src="";
   if(state.decor==="Mickey & Minnie")src=ASSETS.minnie||ASSETS.mickey;
   if(state.decor==="Panda")src=ASSETS.panda;
   if(state.decor==="Bebek Fil")src=ASSETS.elephant;
   if(src){f.src=src;f.style.opacity=1}else f.style.opacity=0;
 }
 if(i===6){$("#nameplate").textContent=(state.name||"")+" "+(state.age?state.age:"");$("#nameplate").style.opacity=1}
}
function renderChips(){$("#chips").innerHTML=Object.entries(state).filter(([k,v])=>v).map(([k,v])=>`<span class="chip">${v}</span>`).join("")||'<span style="font-size:10px;color:var(--muted)">Henüz seçim yapılmadı.</span>'}
function finish(){
 $("#sceneSub").textContent="Pastanız hazır!";$("#status").textContent="Pastacı son dokunuşları tamamladı.";
 setTimeout(()=>{
   const clone=$("#cake").cloneNode(true);clone.removeAttribute("id");clone.style.left="52px";clone.style.bottom="50px";clone.style.transform="scale(1.15)";
   $("#finalCake").innerHTML="";$("#finalCake").appendChild(clone);$("#finalTitle").textContent=`${state.name||""} için pasta hazır! 🎂`;$("#finalOverlay").classList.add("show")
 },650)
}
$("#again").onclick=()=>$("#finalOverlay").classList.remove("show");
$("#share").onclick=async()=>{
 const text=`Kendi pastamı tasarladım 🎂\n${state.base||""} taban\n${state.cream||""} krema\n${state.filling||""}\n${state.coat||""}\n${state.top||""}\n${state.decor||""}\n${state.name||""}${state.age?" · "+state.age+" yaş":""}`;
 if(navigator.share){try{await navigator.share({title:"Pasta Tasarımım",text});return}catch(e){}}
 window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
};
$("#reset").onclick=()=>location.reload();
colors();renderQuestion();renderChips();
</script>
</body></html>
