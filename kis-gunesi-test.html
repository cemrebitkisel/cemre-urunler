<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081424">
<title>Kış Güneşi – Cemre Karışım Motoru</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050b12;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.app{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:#081424;
}
.bg{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:fill;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
  animation:sceneIn .8s ease-out both;
}
@keyframes sceneIn{
  from{filter:blur(5px) brightness(.86);transform:scale(1.012);opacity:.55}
  to{filter:blur(0) brightness(1);transform:scale(1);opacity:1}
}
.hot{
  position:absolute;border:0;background:transparent;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;z-index:20
}
#menuBtn{left:4.6%;top:3.8%;width:12%;height:8%;border-radius:50%}
#shareBtn{left:27%;bottom:8.9%;width:46%;height:7.2%;border-radius:999px}
#prepBtn{left:8%;bottom:1.9%;width:41%;height:5.9%;border-radius:999px}
#retryBtn{right:8%;bottom:1.9%;width:41%;height:5.9%;border-radius:999px}

/* Menü */
.menu{
  position:absolute;left:3%;top:11.8%;
  width:min(58vw,400px);
  background:rgba(12,27,45,.94);
  border:1px solid rgba(255,220,170,.20);
  border-radius:22px;
  overflow:hidden;
  backdrop-filter:blur(14px);
  opacity:0;transform:scale(.96) translateY(-8px);
  pointer-events:none;transition:.18s ease;
  z-index:40;
}
.menu.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
.menu button{
  width:100%;padding:17px 20px;text-align:left;border:0;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:transparent;color:#fff;font-weight:700;font-size:17px
}
.menu button:last-child{border-bottom:0}

/* Modal */
.backdrop{
  position:absolute;inset:0;background:rgba(4,10,18,.60);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:24px;z-index:60
}
.backdrop.show{display:flex}
.modal{
  width:min(88vw,520px);background:rgba(12,27,45,.96);
  border:1px solid rgba(255,220,170,.28);
  color:#fff;border-radius:26px;padding:24px;box-shadow:0 20px 60px #0009
}
.modal h2{margin:0 0 12px;font-size:24px}
.modal p{margin:0 0 16px;line-height:1.45;font-size:16px;color:#eef4fb}
.steps{display:grid;gap:10px;margin:14px 0 20px}
.step{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.07);font-size:16px}
.close{
  width:100%;border:0;border-radius:999px;padding:13px 16px;font-weight:800;font-size:16px;
  background:#f0a949;color:#26180a
}

/* Buhar */
.steam{
  position:absolute;left:61.5%;top:58.5%;width:18%;height:24%;
  pointer-events:none;filter:blur(2px);opacity:.36;z-index:10
}
.steam::before,.steam::after{
  content:"";position:absolute;left:35%;bottom:0;width:28px;height:145px;
  border-left:4px solid rgba(255,255,255,.78);border-radius:50%;
  animation:steam 4s infinite ease-in-out
}
.steam::after{left:58%;animation-delay:1.8s;height:125px}
@keyframes steam{
  0%{transform:translateY(18px) scaleX(.65);opacity:0}
  28%{opacity:.42}
  100%{transform:translateY(-92px) translateX(10px) scaleX(1.4);opacity:0}
}

/* Kar */
.snow{
  position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden;
}
.snow i{
  position:absolute;top:-8%;width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.88);box-shadow:0 0 5px rgba(255,255,255,.55);
  animation:snowfall linear infinite;
}
@keyframes snowfall{
  to{transform:translate3d(18px,115dvh,0) rotate(180deg);opacity:.15}
}

/* Fener / sıcak ışık */
.lanternGlow{
  position:absolute;right:-1%;top:48%;width:19%;height:28%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,185,75,.30),rgba(255,120,25,.11) 45%,transparent 72%);
  mix-blend-mode:screen;pointer-events:none;animation:lantern 4.8s infinite ease-in-out;z-index:9
}
.lanternCore{
  position:absolute;right:5.2%;top:56.5%;width:8%;height:9%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,225,160,.34),rgba(255,155,45,.12) 50%,transparent 72%);
  mix-blend-mode:screen;pointer-events:none;animation:core 3.6s infinite ease-in-out;z-index:10
}
@keyframes lantern{0%,100%{opacity:.48;transform:scale(.98)}44%{opacity:.60;transform:scale(1.03)}70%{opacity:.52}}
@keyframes core{0%,100%{opacity:.48}40%{opacity:.66}63%{opacity:.54}}

/* Gün doğumu ışıması */
.sunGlow{
  position:absolute;right:23%;top:18%;width:22%;height:18%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,120,.20),rgba(255,170,70,.06) 50%,transparent 72%);
  mix-blend-mode:screen;pointer-events:none;animation:sun 7s infinite ease-in-out;z-index:7
}
@keyframes sun{0%,100%{opacity:.35;transform:scale(.98)}50%{opacity:.48;transform:scale(1.03)}}

@media (min-width:700px){
  .app{width:min(100vw,calc(100dvh * 1024 / 1536));margin:0 auto}
}
</style>
</head>
<body>
<div class="app">
  <img class="bg" src="images/kis-gunesi.png" alt="Kış Güneşi">

  <div class="snow" aria-hidden="true">
    <i style="left:5%;animation-duration:8s;animation-delay:-2s"></i>
    <i style="left:14%;animation-duration:10s;animation-delay:-6s"></i>
    <i style="left:23%;animation-duration:7.5s;animation-delay:-1s"></i>
    <i style="left:35%;animation-duration:9s;animation-delay:-4s"></i>
    <i style="left:48%;animation-duration:11s;animation-delay:-8s"></i>
    <i style="left:61%;animation-duration:8.5s;animation-delay:-3s"></i>
    <i style="left:72%;animation-duration:10.5s;animation-delay:-7s"></i>
    <i style="left:83%;animation-duration:7.8s;animation-delay:-5s"></i>
    <i style="left:93%;animation-duration:9.6s;animation-delay:-2.5s"></i>
  </div>
  <div class="steam"></div>
  <div class="lanternGlow"></div>
  <div class="lanternCore"></div>
  <div class="sunGlow"></div>

  <button id="menuBtn" class="hot" aria-label="Menü"></button>
  <button id="shareBtn" class="hot" aria-label="Sonucu Paylaş"></button>
  <button id="prepBtn" class="hot" aria-label="Nasıl Hazırlanır"></button>
  <button id="retryBtn" class="hot" aria-label="Tekrar Dene"></button>

  <div id="menu" class="menu">
    <button data-action="home">Ana Sayfa</button>
    <button data-action="retry">Yeni Karışım / Tekrar Dene</button>
    <button data-action="about">Karışım Motoru Hakkında</button>
  </div>

  <div id="aboutModal" class="backdrop">
    <div class="modal">
      <h2>Cemre Karışım Motoru</h2>
      <p>Dört kısa seçime göre sana uygun bitki çayı karakterini eşleştiren mağaza içi deneyim ekranıdır. Sonuçlar kişisel tıbbi öneri değildir.</p>
      <button class="close" data-close="aboutModal">Kapat</button>
    </div>
  </div>

  <div id="prepModal" class="backdrop">
    <div class="modal">
      <h2>Nasıl Hazırlanır?</h2>
      <div class="steps">
        <div class="step">🥄 1 tatlı kaşığı karışım</div>
        <div class="step">☕ 200–250 ml sıcak su</div>
        <div class="step">⏳ 5–7 dakika demleme</div>
      </div>
      <button class="close" data-close="prepModal">Kapat</button>
    </div>
  </div>
</div>

<script>
const menu=document.getElementById('menu');
const homeUrl='https://cemrebitkisel.github.io/cemre-urunler/';
document.getElementById('menuBtn').onclick=()=>menu.classList.toggle('open');

function openModal(id){menu.classList.remove('open');document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll('.backdrop').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)x.classList.remove('show')}));

document.querySelectorAll('#menu button').forEach(b=>{
  b.onclick=()=>{
    const a=b.dataset.action;
    if(a==='home') location.href=homeUrl;
    if(a==='retry') location.href=homeUrl;
    if(a==='about') openModal('aboutModal');
  };
});

document.getElementById('prepBtn').onclick=()=>openModal('prepModal');
document.getElementById('retryBtn').onclick=()=>location.href=homeUrl;

document.getElementById('shareBtn').onclick=async()=>{
  const shareUrl=location.origin+location.pathname+'?result=kis-gunesi';
  const data={
    title:'Cemre Karışım Motoru – Kış Güneşi',
    text:'Benim Cemre Karışımım: Kış Güneşi — Soğuk günlere sıcaklık katan, baharatlı ve meyvemsi karaktere sahip özel bir karışım.',
    url:shareUrl
  };
  try{
    if(navigator.share) await navigator.share(data);
    else{
      await navigator.clipboard.writeText(shareUrl);
      alert('Sonuç bağlantısı kopyalandı.');
    }
  }catch(e){}
};
</script>
</body>
</html>
