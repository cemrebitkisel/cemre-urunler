<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zamanın İzinde - Tam Ekran Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0713}
body{font-family:Arial,Helvetica,sans-serif}
.app{position:fixed;inset:0;display:grid;place-items:center;width:100%;height:100%;overflow:hidden;background:#0b0713}
.screen{position:absolute;left:50%;top:50%;width:min(100vw,calc(100dvh * 991 / 1587));height:min(100dvh,calc(100vw * 1587 / 991));aspect-ratio:991/1587;transform:translate(-50%,-50%);overflow:hidden;background:#0b0713}
.mock{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;user-select:none;-webkit-user-drag:none}
@media(max-width:600px){
 .app{width:100vw;height:100dvh}
 .screen{left:0;top:0;width:100vw;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;transform:none}
 .mock{width:100%;height:100%;object-fit:fill}
}
</style>
</head>
<body>
<div class="app">
  <div class="screen">
    <img class="mock" src="images/zamanin-izinde-sade.png" alt="Zamanın İzinde sonuç ekranı">
  </div>
</div>
</body>
</html>
